<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <title>공지사항 수정 | Bank 은행 통합 관리자 센터</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <div class="wrap">
    <dialog class="modal" aria-labelledby="modal-title" open>
      <div class="modal__inner">
        <header class="modal__header">
          <h1 class="modal__title" id="modal-title">공지사항 수정</h1>
          <button type="button" class="modal__close" aria-label="팝업 닫기">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18" /><path d="M6 6l12 12" /></svg>
          </button>
        </header>

        <form class="modal__form" action="#" aria-labelledby="modal-title">
          <div class="modal__body">
            <p class="field__hint"><span class="field__required" aria-hidden="true">*</span> 표시는 필수 입력 항목이에요.</p>

            <div class="modal__row">
              <div class="field">
                <span class="field__label">작성자</span>
                <span class="input-static">김관리</span>
              </div>

              <div class="field">
                <label class="field__label" for="inp_02">구분 <span class="field__required" aria-hidden="true">*</span></label>
                <select class="select" id="inp_02" required>
                  <option selected>공지사항</option>
                  <option>자료실</option>
                </select>
              </div>

              <fieldset class="field">
                <legend class="field__label">노출 여부</legend>
                <div class="segment segment--sm">
                  <input type="radio" class="segment__input" id="radio_on" name="expose_yn" value="Y" checked />
                  <label class="segment__label" for="radio_on">노출</label>
                  <input type="radio" class="segment__input" id="radio_off" name="expose_yn" value="N" />
                  <label class="segment__label" for="radio_off">미노출</label>
                </div>
              </fieldset>
            </div>

            <div class="field">
              <label class="field__label" for="inp_03">제목 <span class="field__required" aria-hidden="true">*</span></label>
              <input type="text" class="input" id="inp_03" value="공지사항 제목" required />
            </div>

            <div class="field">
              <label class="field__label" for="inp_04">내용 <span class="field__required" aria-hidden="true">*</span></label>
              <textarea class="textarea" id="inp_04" rows="7" required>공지사항 내용</textarea>
            </div>

            <div class="field attach-file__box" data-attach-max="9">
              <div class="attach-file__head">
                <span class="field__label" id="attach-label">첨부파일</span>
                <span class="attach-file__rule">hwp, pdf, txt · 최대 9개</span>
              </div>
              <ul class="attach-file__list" aria-labelledby="attach-label">
                <li class="attach-file__item attach-file__item--selected">
                  <svg class="file__icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /></svg>
                  <span class="file__name">업무 체크리스트1.hwp</span>
                  <button type="button" class="file__delete" aria-label="업무 체크리스트1.hwp 삭제">
                    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18" /><path d="M6 6l12 12" /></svg>
                  </button>
                </li>
                <li class="attach-file__item attach-file__item--selected">
                  <svg class="file__icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" /></svg>
                  <span class="file__name">업무 체크리스트2.hwp</span>
                  <button type="button" class="file__delete" aria-label="업무 체크리스트2.hwp 삭제">
                    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18" /><path d="M6 6l12 12" /></svg>
                  </button>
                </li>
                <li class="attach-file__item attach-file__item--new">
                  <input type="file" accept=".hwp,.pdf,.txt" id="file_3" class="file__input a11y-hidden" />
                  <label for="file_3" class="file__label">
                    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14" /><path d="M5 12h14" /></svg>
                    파일 선택
                  </label>
                </li>
                <li class="file__name--empty" hidden>선택한 파일이 없어요.</li>
              </ul>
            </div>
          </div>

          <div class="modal__btn">
            <button type="button" class="btn btn--outline">취소</button>
            <button type="submit" class="btn btn--primary btn--wide">수정</button>
          </div>
        </form>
      </div>
    </dialog>
  </div>

  <script src="../js/ui.js"></script>
</body>

</html>
