<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <title>Bank 은행 통합 관리자 센터</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/jquery-3.6.1.min.js"></script>
  <script src="../js/jquery-ui.min.js"></script>
  <script src="../js/template.js"></script>
</head>

<body>

  <main id="main-content" class="wrap">
    <section class="section-container" aria-label="로그인 페이지">
      <div class="login__box">

        <header class="login__header">
          <img class="login__logo" src="../img/logo_icon.png" alt="은행 로고" />
          <h2 class="login__title"><span>Bank 은행 통합 관리자 센터</span> 로그인</h2>
        </header>

        <form class="login__form" action="#" aria-label="관리자 로그인">

          <div class="login__input-box">
            <label for="userId" class="login__label a11y-hidden">아이디</label>
            <input type="text" id="userId" class="login__input" name="userId" placeholder="아이디를 입력하세요"
              autocomplete="username" />
          </div>

          <div class="login__input-box">
            <label for="password" class="login__label a11y-hidden">인증번호</label>
            <input type="password" id="password" class="login__input" name="password" placeholder="인증번호를 입력하세요" disabled
              aria-describedby="password-guide" autocomplete="current-password" />
            <span id="password-guide" class="a11y-hidden">OTP 인증 선택 시 활성화됩니다</span>
          </div>

          <fieldset class="login__radio-box radio-btn">
            <legend class="a11y-hidden">인증 방식 선택</legend>
            <input type="radio" id="fidoNum" name="login__radio-btn" value="fido" checked />
            <label for="fidoNum">FIDO 인증</label>
            <input type="radio" id="otpNum" name="login__radio-btn" value="otp" />
            <label for="otpNum">OTP 인증</label>
          </fieldset>

          <button type="submit" class="login-btn mt20">로그인</button>
        </form>

        <p class="login-notice">
          문의전화<br />
          통합 관리자 센터 운영 : 2836, 2844, 2865
        </p>

      </div>
    </section>
  </main>

  <script src="../js/ui.js"></script>
</body>

</html>
